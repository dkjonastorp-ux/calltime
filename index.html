<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#141416;--tx:#f5f5f7;--mut:#8e8e93;--ac:#0a84ff;--acx:#fff;--bd:rgba(255,255,255,.08);--fld:#1f1f22;--warn:#ff453a}}

body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}

.top{margin-bottom:20px;align-items:flex-end}

:root{--bg:#f2f2f7;--card:#fff;--fld:#f2f2f7;--pill:rgba(120,120,128,.16);--bd:rgba(60,60,67,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--fld:#2c2c2e;--pill:rgba(120,120,128,.32);--bd:rgba(255,255,255,.07)}}

.alert{display:flex;align-items:center;gap:12px;background:#ff453a;color:#fff;border-radius:18px;padding:12px 16px;margin-bottom:12px;font-weight:700;cursor:pointer}
.alert small{display:block;font-weight:400;opacity:.9;font-size:13px}
.alert .clk{margin-left:auto;font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

.wkb button.l{font-size:14px}

<body>
<main>
<div id="alert"></div><div id="back"></div><div class="eyebrow" id="eyebrow"></div><div class="top"><h1 id="title">CallTime</h1><span class="badge" id="badge"></span></div>
<div id="app"></div>
<p class="note">Beregningen følger reklamefilmsoverenskomsten 2024–26 og fiktionsoverenskomsten 2025–27. Transporttid regnes for dage uden overnatning. Den medregner ikke rejsetid, udstationering, forberedelsesdage, rabatordninger, pension, feriepenge eller diæter. Tjek altid mod din kontrakt og FAF.</p>
</main>
<script>
var KEY='filmdage-v1';
var S={jobs:[],updated:0};
var view=null, openDay=null, armed=null;
var copiedT=false,jobEdit=false,expMsg='',expShow=false;
var sel={}, outText=null, outMsg='', copied=false, delOpen=false;
var docRef=null, timer=null, writing=false;
var AG={reklame:'Reklamefilm',fiktion:'Fiktion'};
var GEAR=['Steadicam','Cyclo Lite','Segway','Rickshaw'];
var fmt=new Intl.NumberFormat('da-DK',{style:'currency',currency:'DKK',maximumFractionDigits:0});
var fmt2=new Intl.NumberFormat('da-DK',{maximumFractionDigits:2});
function p2(n){return (n<10?'0':'')+n;}
function hm(m){return p2(Math.floor(m/60))+':'+p2(m%60);}
function ld(t){return t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(t.getDate());}
function flag(n){
  try{document.title=(n?'● ':'')+'CallTime';}catch(e){}
  try{var l=document.querySelector('link[rel=icon]');if(!l){l=document.createElement('link');l.rel='icon';document.head.appendChild(l);}
    l.href='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#1c1c1e"/><circle cx="32" cy="34" r="15" fill="none" stroke="#fff" stroke-width="5"/>'+(n?'<circle cx="50" cy="14" r="12" fill="#ff453a"/>':'')+'</svg>');}catch(e){}
  try{if(navigator.setAppBadge){var p=n?navigator.setAppBadge(n):navigator.clearAppBadge();if(p&&p.catch)p.catch(function(){});}}catch(e){}
}
function uid(){return Math.random().toString(36).slice(2,9);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function loadLocal(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.jobs)S=o;}}catch(e){}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function setBadge(t){document.getElementById('badge').textContent=t;}

function mutate(fn){fn();S.updated=Date.now();saveLocal();clearTimeout(timer);timer=setTimeout(push,500);
  render();}
function openDays(){var od=[];S.jobs.forEach(function(jj){jj.days.forEach(function(dd){if(dd.start&&!dd.end)od.push({j:jj,d:dd});});});return od;}
function elapsed(d){var st=new Date((d.date||ld(new Date()))+'T'+d.start+':00'),m=Math.max(0,Math.floor((Date.now()-st)/60000));return Math.floor(m/60)+':'+p2(m%60);}
function drawAlert(){
  var od=openDays(),al=document.getElementById('alert');
  al.innerHTML=od.map(function(o){return '<div class="alert" data-act="gotoopen" data-job="'+o.j.id+'" data-id="'+o.d.id+'"><span class="dot"></span><div>Aktiv dag<small>'+esc(o.j.name||'Uden navn')+' · startet '+esc(o.d.start)+'</small></div><span class="clk">'+elapsed(o.d)+'</span></div>';}).join('');
  document.documentElement.classList.toggle('live',od.length>0);
  flag(od.length);
}
setInterval(drawAlert,20000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)drawAlert();});
function push(){
  if(!docRef)return;
  if(writing){timer=setTimeout(push,300);return;}
  writing=true;
  docRef.set({json:JSON.stringify(S),updated:S.updated}).then(function(){setBadge('Synkroniseret');}).catch(function(){setBadge('Synk-fejl – gemt på denne enhed');}).then(function(){writing=false;});
}
var auth=null,user,authErr='',authMsg='',unsub=null,impOpen=false,impMsg='';
function initSync(){
  if(!(window.firebase&&window.FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey)){setBadge('Gemmes kun på denne enhed');return;}
  try{firebase.initializeApp(FIREBASE_CONFIG);}catch(e){setBadge('Firebase-fejl');return;}
  var db=firebase.firestore();
  try{db.enablePersistence({synchronizeTabs:true}).catch(function(){});}catch(e){}
  auth=firebase.auth();
  auth.onAuthStateChanged(function(u){
    user=u||null;if(unsub){unsub();unsub=null;}docRef=null;
    if(!u){setBadge('Ikke logget ind');render();return;}
    docRef=db.doc('users/'+u.uid+'/data/state');
    unsub=docRef.onSnapshot(function(snap){
      if(snap.exists){
        var x=snap.data()||{};
        if((x.updated||0)>S.updated){try{S=JSON.parse(x.json);saveLocal();render();}catch(e){}}
        else if((x.updated||0)<S.updated){push();}
      }else if(S.jobs.length){push();}
      setBadge(snap.metadata&&snap.metadata.fromCache?'Offline – synker senere':'Synkroniseret');
    },function(){setBadge('Synk-fejl – gemt på denne enhed');});
    render();
  });
}
function authError(e){
  var c=(e&&e.code)||'';
  return {'auth/invalid-email':'Ugyldig e-mail.','auth/missing-password':'Skriv en adgangskode.','auth/weak-password':'Adgangskoden skal være mindst 6 tegn.','auth/email-already-in-use':'Der findes allerede en konto med den e-mail. Log ind i stedet.','auth/invalid-credential':'Forkert e-mail eller adgangskode.','auth/wrong-password':'Forkert e-mail eller adgangskode.','auth/user-not-found':'Forkert e-mail eller adgangskode.','auth/too-many-requests':'For mange forsøg. Vent lidt og prøv igen.','auth/network-request-failed':'Ingen forbindelse til nettet.'}[c]||('Fejl: '+(e&&e.message||c));
}
function loginView(){
  return '<div class="card"><h2>Log ind</h2><div class="mut" style="margin-bottom:12px">Log ind for at synkronisere dine jobs mellem iPhone og Mac.</div>'
    +'<label>E-mail<input id="le" type="email" autocomplete="username" autocapitalize="off" inputmode="email"></label>'
    +'<label>Adgangskode<input id="lp" type="password" autocomplete="current-password"></label>'
    +(authErr?'<div style="color:var(--warn);margin:4px 0 10px">'+esc(authErr)+'</div>':'')
    +(authMsg?'<div class="mut" style="margin:4px 0 10px">'+esc(authMsg)+'</div>':'')
    +'<div class="row" style="margin-top:6px;justify-content:space-between"><button class="p" data-act="login">Log ind</button><button data-act="signup">Opret konto</button></div>'
    +'<div style="margin-top:10px"><button class="l" data-act="resetpw" style="font-size:14px">Glemt adgangskode?</button></div></div>';
}
function isStandalone(){try{return navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;}catch(e){return false;}}

/* ---------- beregning ---------- */
function mins(t){var p=t.split(':');return (+p[0])*60+(+p[1]);}
function qh(h){return Math.ceil(h*4-1e-9)/4;}
function isoAdd(ds,n){var t=new Date(ds+'T12:00:00');t.setDate(t.getDate()+n);return t.toISOString().slice(0,10);}
function easter(y){var a=y%19,b=Math.floor(y/100),c=y%100,dd=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-dd-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return y+'-'+(mo<10?'0':'')+mo+'-'+(da<10?'0':'')+da;}
function isOff(ds){
  var dt=new Date(ds+'T12:00:00'),w=dt.getDay();
  if(w===0||w===6)return true;
  var md=ds.slice(5);if(md==='01-01'||md==='12-25'||md==='12-26')return true;
  var e=easter(dt.getFullYear());
  return [-3,-2,0,1,39,49,50].some(function(n){return isoAdd(e,n)===ds;});
}
function wkRate(job,d){
  if(!d.date||!isOff(d.date))return 0;
  var nb=[isoAdd(d.date,-1),isoAdd(d.date,1)];
  var two=job.days.some(function(x){return x!==d&&x.date&&nb.indexOf(x.date)>=0&&isOff(x.date);});
  return two?100:75;
}
function calc(job,d){
  var L=[];
  if(!d.start||!d.end)return {L:L,tot:0,H:0,eq:0};
  var s=mins(d.start),e=mins(d.end);if(e<=s)e+=1440;
  var H=qh(Math.max(0,(e-s-(job.agr==='fiktion'?30:0))/60));
  var fik=job.agr==='fiktion';
  var rate=+job.rate||0;if(fik&&job.single)rate*=1.1;
  var hr=rate/8,wk=wkRate(job,d);
  var T=qh(Math.max(0,+d.tr||0)),Tp=0;
  if(!fik&&T>0){var fill=Math.min(T,Math.max(0,10-H));H+=fill;Tp=T-fill;}
  function add(t,a,q){if(a>0.004)L.push([t,a,q==null?1:q]);}
  function ov(a,b){return Math.max(0,Math.min(H,b)-a);}
  var ev=0,ni=0,fo=0;
  for(var t=s;t<e;t+=15){var c=t%1440;if(c>=1080)ev++;if(c<360)ni++;if(c>=1140||c<360)fo++;}
  var i,b,bands;
  if(!fik){
    add('Dagsløn (8 timer)',rate);
    if(job.grp==='5'){
      add('Overtid 9.–13. time (timeløn + 200 kr)',ov(8,13)*(hr+200),ov(8,13));
      add('Overtid fra 14. time (timeløn + 350 kr)',ov(13,99)*(hr+350),ov(13,99));
    }else{
      bands=[[8,10,0.25,'9.–10. time (+25 %)'],[10,12,1,'11.–12. time (+100 %)'],[12,13,1.5,'13. time (+150 %)'],[13,99,2,'14. time og derover (+200 %)']];
      for(i=0;i<bands.length;i++){b=bands[i];add('Overtid '+b[3],ov(b[0],b[1])*hr*(1+b[2]),ov(b[0],b[1]));}
    }
    if(wk)add('Weekend-/helligdagstillæg '+wk+' %',Math.ceil(H)*hr*wk/100,Math.ceil(H));
    if(d.gene!==false){
      if(ev)add('Genetillæg kl. 18–24',100);
      if(ni)add('Genetillæg kl. 24–06',200);
    }
  }else{
    var bh=Math.min(Math.max(H,4),8);
    if(wk){
      add('Weekend-/helligdagsløn (min. 4 t)',bh*hr,bh);
      add('Weekend-/helligdagstillæg '+wk+' %',Math.max(H,4)*hr*wk/100,Math.max(H,4));
    }else add('Dagsløn (8 timer)'+(job.single?' inkl. 10 % enkeltdagstillæg':''),rate);
    bands=((d.unv===true||d.unv==='u')&&!wk)?[[8,9,0.75,'1. time (+75 %, uvarslet)'],[9,10,1,'2. time (+100 %, uvarslet)'],[10,99,1.35,'3. time og derover (+135 %)']]
      :[[8,9,0.5,'1. time (+50 %)'],[9,10,0.6,'2. time (+60 %)'],[10,99,1.35,'3. time og derover (+135 %)']];
    for(i=0;i<bands.length;i++){b=bands[i];add('Overarbejde '+b[3],ov(b[0],b[1])*hr*(1+b[2]),ov(b[0],b[1]));}
    if(!wk&&fo&&d.gene!==false)add('Forskudt arbejdstid kl. 19–06',fo/4*110,fo/4);
  }
  if(fik){if(T>0)add('Transporttid over 35 km (normaltimeløn)',T*hr,T);}
  else if(Tp>0){
    add('Transporttid efter 10. time (+75 %)',Tp*hr*1.75,Tp);
    if(wk)add('Weekend-/helligdagstillæg på transport '+wk+' %',Tp*hr*wk/100,Tp);
  }
  var tot=0;for(i=0;i<L.length;i++)tot+=L[i][1];
  var eq=0;
  return {L:L,tot:tot,H:H,eq:eq};
}
function jobTotals(job){var a=0,b=0;job.days.forEach(function(d){var r=calc(job,d);a+=r.tot;b+=r.eq;});return {pay:a,eq:b};}

function buildText(job,days){
  var out=[],tot=0,fik=job.agr==='fiktion';
  days.slice().sort(function(a,b){return (a.date||'').localeCompare(b.date||'');}).forEach(function(d){
    var r=calc(job,d);tot+=r.tot;
    out.push('');
    var dt='Dato mangler';if(d.date){var dd=new Date(d.date+'T12:00:00'),wd=dd.toLocaleDateString('da-DK',{weekday:'short'}).replace('.','');dt=wd.charAt(0).toUpperCase()+wd.slice(1)+' '+dd.getDate()+'/'+(dd.getMonth()+1);}
    out.push(dt+' · '+d.start+'–'+d.end+' · '+fmt2.format(r.H)+' timer');
    if(+d.tr)out.push('Transporttid: '+fmt2.format(+d.tr)+' timer');
    if(d.gear&&d.gear.length)out.push('Udstyr: '+d.gear.join(', '));
    r.L.forEach(function(x){out.push('  '+fmt2.format(x[2])+'x '+x[0]+': '+fmt.format(x[1]));});
    out.push('  Løn for dagen: '+fmt.format(r.tot));
  });
  var gc=GEAR.map(function(g){var n=days.filter(function(d){return d.gear&&d.gear.indexOf(g)>=0;}).length;return n?g+': '+n+(n===1?' dag':' dage'):null;}).filter(Boolean);
  if(gc.length){out.push('');out.push('Udstyr brugt:');gc.forEach(function(x){out.push('  '+x);});}
  out.push('');
  out.push('I alt ('+days.length+(days.length===1?' dag':' dage')+'): '+fmt.format(tot));
  return out.join('\n').replace(/^\n+/,'');
}
function copyNow(text,kind){
  var done=function(){if(kind)copiedT=kind;else copied=true;render();setTimeout(function(){copied=false;copiedT=false;render();},2000);};
  var fail=function(){outText=text;outMsg='Markér og kopiér teksten.';render();};
  var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0;left:0';
  document.body.appendChild(ta);ta.focus();ta.select();try{ta.setSelectionRange(0,text.length);}catch(e){}
  var ok=false;try{ok=document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
  if(ok)done();
  else if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,fail);
  else fail();
}
function doCopy(){

}

    var ch=j.days.filter(function(d){return sel[d.id]&&d.date;}).sort(function(x,y){return (x.date+x.start).localeCompare(y.date+y.start);});
    if(!ch.length)return;
    var rows=[],dt=ch[0].date,last=ch[ch.length-1].date,i=0,guard=0;
    while(dt<=last&&guard++<62){
      var same=ch.filter(function(d){return d.date===dt;});
      if(same.length)same.forEach(function(d){rows.push((d.start||'')+'\t'+(d.end||''));});
      else rows.push('\t');
      dt=isoAdd(dt,1);
    }
    outText=null;outMsg='';copyNow(rows.join('\n'),'t');
  }
  else if(a==='deleq')mutate(function(){dayById(id).eq.splice(+el.dataset.i,1);});
  else if(a==='delday'){if(armed==='d'+id)mutate(function(){j.days=j.days.filter(function(d){return d.id!==id;});openDay=null;armed=null;});else{armed='d'+id;render();}}
  else if(a==='delopen'){delOpen=true;render();var ci=document.getElementById('delconf');if(ci)ci.focus();}
  else if(a==='delcancel'){delOpen=false;render();}
  else if(a==='deljob'){var cf=document.getElementById('delconf');if(cf&&cf.value.trim().toUpperCase()==='SLET')mutate(function(){S.jobs=S.jobs.filter(function(x){return x.id!==view;});view=null;armed=null;delOpen=false;});}
});
document.addEventListener('change',function(ev){
  var t=ev.target,j=curJob(),v=t.type==='checkbox'?t.checked:t.value,d;
  if(t.dataset.j&&j)mutate(function(){
    var f=t.dataset.j,old=j.agr;
    j[f]=(f==='rate')?(parseFloat(v)||0):v;
    if(f==='agr'&&v!==old){
      var od=old==='fiktion'?30:0,nd=v==='fiktion'?30:0;
      j.days.forEach(function(x){if((+x.pause||0)===od)x.pause=nd;});
    }
  });
  else if(t.dataset.d&&j&&(t.type==='time'||t.type==='date')&&document.activeElement===t){d=dayById(t.dataset.id);if(!d)return;
    d[t.dataset.d]=v;
    if(t.dataset.d==='date'&&v){var dw2=new Date(v+'T12:00:00').getDay();d.wk=(dw2===0||dw2===6)?75:0;}
    S.updated=Date.now();saveLocal();clearTimeout(timer);timer=setTimeout(push,500);pendingRender=true;
  }
  else if(t.dataset.d&&j){d=dayById(t.dataset.id);if(d)mutate(function(){
    var f=t.dataset.d;d[f]=(f==='pause'||f==='tr')?(parseFloat(v)||0):v;
    if(f==='date'&&v){var dw=new Date(v+'T12:00:00').getDay();d.wk=(dw===0||dw===6)?75:0;}
  });}
  else if(t.dataset.t&&j){d=dayById(t.dataset.id);if(d){
    var box=t.parentNode,hs=box.querySelector('[data-t=h]').value,ms=box.querySelector('[data-t=m]').value;
    if(!hs&&!ms)return;
    mutate(function(){d[t.dataset.f]=(hs||'00')+':'+(ms||'00');});
  }}
  else if(t.dataset.sel){sel[t.dataset.sel]=t.checked;outText=null;outMsg='';render();}
  else if(t.dataset.g&&j){d=dayById(t.dataset.id);if(d)mutate(function(){d.gear=d.gear||[];var gi=d.gear.indexOf(t.dataset.g);if(t.checked&&gi<0)d.gear.push(t.dataset.g);if(!t.checked&&gi>=0)d.gear.splice(gi,1);});}
  else if(t.dataset.eq&&j){d=dayById(t.dataset.id);if(d)mutate(function(){d.eq[+t.dataset.i][t.dataset.eq]=v;});}
});

/* tidsvælger: tegn først siden igen når feltet forlades, så iOS-hjulet ikke lukker */
var pendingRender=false;
document.addEventListener('focusout',function(){if(pendingRender){pendingRender=false;setTimeout(render,0);}});

/* gem mens der skrives (iOS udløser ikke altid "change" før man trykker et andet sted) */
document.addEventListener('input',function(ev){
  if(ev.target.id==='delconf'){var bt=document.getElementById('delbtn');if(bt)bt.disabled=ev.target.value.trim().toUpperCase()!=='SLET';return;}
  var t=ev.target,j=curJob();
  if(!j||t.type==='checkbox'||t.tagName==='SELECT')return;
  var v=t.value,d,f;
  if(t.dataset.j){f=t.dataset.j;j[f]=(f==='rate')?(parseFloat(v)||0):v;}
  else if(t.dataset.d==='note'||t.dataset.d==='tr'){
    d=dayById(t.dataset.id);if(!d)return;
    d[t.dataset.d]=(t.dataset.d==='tr')?(parseFloat(v)||0):v;
  }else return;
  S.updated=Date.now();saveLocal();clearTimeout(timer);timer=setTimeout(push,500);
});

loadLocal();render();initSync();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
